name: Build
on:
  push:
    branches:
    - master
    paths-ignore:
    - 'README.md'
    - 'VERSION.txt'
  pull_request:
    branches:
    - master

permissions:
  contents: read

jobs:
  build:
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        java_version: ['8', '11', '17', '21']
    env:
      JAVA_OPTS: '-XX:+TieredCompilation -XX:TieredStopAtLevel=1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java_version }}
        cache: 'maven'
    - name: Build
      run: ./mvnw -B -q -ff -ntp verify
    - name: Generate code coverage
      if: ${{ github.event_name != 'pull_request' && matrix.java_version == '8' }}
      run: ./mvnw -B -q -ff -ntp test
    - name: Publish code coverage
      if: ${{ github.event_name != 'pull_request' && matrix.java_version == '8' }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./target/site/jacoco/jacoco.xml
        flags: unittests

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'maven'
      # Cache the Jazzer fuzzing corpus so that fuzzing can continue from the previous
      # progress it made, instead of starting from scratch
      - name: Cache fuzzing corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cifuzz-corpus/
          # Invalidate cache when fuzz test changes; it might be consuming the fuzzing data differently
          # now and the previous data would be misinterpreted
          # Don't invalidate when POM or main sources change; fuzz corpus represents LZF data, and that
          # is unaffected by implementation changes
          key: fuzz-corpus-${{ hashFiles('src/test/java/com/ning/compress/lzf/TestFuzzUnsafeLZF.java') }}
      - name: Run tests
        id: fuzz-tests
        # Don't run with `-q`, to see fuzzing progress
        run: ./mvnw -B -ff -ntp --activate-profiles fuzz test
      - name: Upload fuzz test inputs
        if: ${{ !cancelled() && steps.fuzz-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-test-inputs
          path: src/test/resources/**/*Inputs/**
